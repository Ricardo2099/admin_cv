<div class="container color-dark">
  <div class="col">
    <h2 class="header-title">Administrar Certificados</h2>
    <p class="header-description">Agrega, edita y elimina tus certificados.</p>
  </div>
</div>

<div class="container color-light">
  <div class="form-container">
    <form (ngSubmit)="AgregarOActualizar()">
      <div class="form-group">
        <label for="certificacion">Certificación</label>
        <input type="text" class="txt" name="certificacion" id="certificacion" placeholder="Certificación" [(ngModel)]="myCertificate.certificacion" />
      </div>

      <div class="form-group">
        <label for="fechaObtencion">Fecha de obtención</label>
        <input type="text" class="txt" name="fechaObtencion" id="fechaObtencion" placeholder="Fecha de obtención" [(ngModel)]="myCertificate.fechaObtencion" />
      </div>

      <div class="form-group">
        <label for="institucion">Institución</label>
        <input type="text" class="txt" name="institucion" id="institucion" placeholder="Institución" [(ngModel)]="myCertificate.institucion" />
      </div>

      <button type="submit" class="btn-submit">{{ btnTxt }}</button>
    </form>
  </div>

  <div class="header-list">
    <h3>Lista de Certificados</h3>
    <div class="header-items" *ngFor="let cert of certificates">
      <div class="header-item">
        <p><strong>{{ cert.certificacion }}</strong> - {{ cert.institucion }} ({{ cert.fechaObtencion }})</p>
        <div class="btn-group">
          <button class="btn-edit" (click)="EditarCertificate(cert)">Editar</button>
          <button class="btn-delete" (click)="deleteCertificate(cert.id)">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
