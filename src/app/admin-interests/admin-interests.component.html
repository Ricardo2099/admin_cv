<div class="container color-dark">
  <div class="col">
    <h2 class="header-title">Administrar Intereses</h2>
    <p class="header-description">Agrega, edita y elimina tus intereses personales y profesionales.</p>
  </div>
</div>

<div class="container color-light">
  <div class="form-container">
    <form (ngSubmit)="AgregarOActualizar()">
      <div class="form-group">
        <label for="actividadesExtracurriculares">Actividades Extracurriculares</label>
        <input type="text" class="txt" name="actividadesExtracurriculares" id="actividadesExtracurriculares" placeholder="Actividades Extracurriculares" [(ngModel)]="myInterest.actividadesExtracurriculares" />
      </div>

      <div class="form-group">
        <label for="culturalEventos">Eventos Culturales</label>
        <input type="text" class="txt" name="culturalEventos" id="culturalEventos" placeholder="Eventos Culturales" [(ngModel)]="myInterest.culturalEventos" />
      </div>

      <div class="form-group">
        <label for="deportes">Deportes</label>
        <input type="text" class="txt" name="deportes" id="deportes" placeholder="Deportes" [(ngModel)]="myInterest.deportes" />
      </div>

      <div class="form-group">
        <label for="hobbiesActividades">Hobbies / Actividades</label>
        <input type="text" class="txt" name="hobbiesActividades" id="hobbiesActividades" placeholder="Hobbies / Actividades" [(ngModel)]="myInterest.hobbiesActividades" />
      </div>

      <div class="form-group">
        <label for="interesesProfesionales">Intereses Profesionales</label>
        <input type="text" class="txt" name="interesesProfesionales" id="interesesProfesionales" placeholder="Intereses Profesionales" [(ngModel)]="myInterest.interesesProfesionales" />
      </div>

      <button type="submit" class="btn-submit">{{ btnTxt }}</button>
    </form>
  </div>

  <div class="header-list">
    <h3>Lista de Intereses</h3>
    <div class="header-items" *ngFor="let interest of interests">
      <div class="header-item">
        <p><strong>{{ interest.actividadesExtracurriculares }}</strong> | {{ interest.culturalEventos }} | {{ interest.deportes }} | {{ interest.hobbiesActividades }} | {{ interest.interesesProfesionales }}</p>
        <div class="btn-group">
          <button class="btn-edit" (click)="EditarInterest(interest)">Editar</button>
          <button class="btn-delete" (click)="deleteInterest(interest.id)">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
